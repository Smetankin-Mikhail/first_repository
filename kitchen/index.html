<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F5F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<title>Кухня на неделю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: mobile app shell — sticky header with day strip, single column of meal cards, recipe opens as a full-screen sheet, fixed bottom tab bar. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --sunken:#E8EDE5; --ink:#1C231F; --muted:#5B665F; --line:#D9E0D5;
  --herb:#2E6A4E; --herb-soft:#DCEBE1; --tomato:#C2452D; --tomato-soft:#F6E0DA;
  --him:#2F5E8C; --him-soft:#DDE8F3; --her:#A8456A; --her-soft:#F4DFE7;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#191F1B; --sunken:#202823; --ink:#E6ECE7; --muted:#9BA69E; --line:#2B352F;
  --herb:#74C196; --herb-soft:#1F3328; --tomato:#EE7A61; --tomato-soft:#3A221D;
  --him:#86AEDB; --him-soft:#1C2A39; --her:#E68FAF; --her-soft:#3A2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#191F1B; --sunken:#202823; --ink:#E6ECE7; --muted:#9BA69E; --line:#2B352F;
  --herb:#74C196; --herb-soft:#1F3328; --tomato:#EE7A61; --tomato-soft:#3A221D;
  --him:#86AEDB; --him-soft:#1C2A39; --her:#E68FAF; --her-soft:#3A2230; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--herb);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.brand .wk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.day b{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day span{font-family:var(--display);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:var(--surface)}
.day[aria-pressed="true"] b{color:var(--surface);opacity:.85}
.day .today{position:absolute;bottom:-4px;width:6px;height:6px;border-radius:50%;background:var(--tomato);border:2px solid var(--bg)}

main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.dayhead h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--tomato-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.notice svg{flex:none;margin-top:2px;color:var(--tomato)}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.meal:hover{border-color:var(--herb)}
.meal.static{cursor:default}
.meal.static:hover{border-color:var(--line)}
.meal .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.pill.him{background:var(--him-soft);color:var(--him)}
.pill.her{background:var(--her-soft);color:var(--her)}
.pill.both{background:var(--herb-soft);color:var(--herb)}
.meal h3{margin:0;font-size:18px;font-weight:700;line-height:1.3;text-wrap:balance}
.meal .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal .meta i{font-style:normal;font-weight:700}
.meal .meta .h{color:var(--him)} .meal .meta .s{color:var(--her)}
.meal .go{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--herb);font-weight:600}
.meal p{margin:0;color:var(--muted);font-size:14px}

/* Recipe sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-weight:600;font-size:14px}
.wake{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.wake input{accent-color:var(--herb);width:18px;height:18px}
.sheet .body{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.rh h2{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2;margin:6px 0 8px;text-wrap:balance}
.rh .sub{color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.fact b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fact span{font-family:var(--display);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.fact.h span{color:var(--him)} .fact.s span{color:var(--her)}
section.blk h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunken)}
th.h{color:var(--him)} th.s{color:var(--her)}
td.n{font-weight:600}
td.q{white-space:nowrap;color:var(--muted)}
td.h{color:var(--him);white-space:nowrap;font-weight:600}
td.s{color:var(--her);white-space:nowrap;font-weight:600}
td .dash{color:var(--line)}
.legend{font-size:13px;color:var(--muted);margin:8px 2px 0}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
ol.steps li::before{content:counter(st);font-family:var(--display);font-size:15px;font-weight:600;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--ink)}
ol.steps li.done{opacity:.55}
ol.steps li.done::before{content:"✓";background:var(--herb);color:var(--surface)}
ol.steps .st b{display:block;font-weight:700;margin-bottom:2px}
ol.steps .st p{margin:0}
.timer{margin-top:8px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--herb);color:var(--herb);background:transparent;border-radius:999px;padding:4px 12px 4px 8px;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.timer:hover{background:var(--herb-soft)}
.box{background:var(--herb-soft);border-radius:var(--r);padding:12px 14px}
.box p{margin:0}
.box p+p{margin-top:6px}
.salad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.salad h4{margin:0;font-size:16px}
.salad p{margin:0}
.salad .k{font-size:13px;color:var(--muted)}
.salad ul{margin:0;padding-left:18px}

/* Shopping */
.trip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trip .th{padding:14px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.trip .th h3{margin:0;font-size:17px}
.trip .th p{margin:0;color:var(--muted);font-size:14px}
.prog{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--herb);width:0;transition:width .2s}
.grp{padding:10px 14px 4px}
.grp h4{margin:4px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.grp .item:last-child{border-bottom:0}
.item input{accent-color:var(--herb);width:20px;height:20px;margin:1px 0 0;flex:none}
.item.done span{text-decoration:line-through;color:var(--muted)}
.trip .tf{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--sunken)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--herb);border-color:var(--herb);color:var(--surface)}
.copyout{width:100%;min-height:120px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}

/* Norms */
.norms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.norm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.norm b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.norm.h b{color:var(--him)} .norm.s b{color:var(--her)}
.norm .big{font-family:var(--display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.norm small{color:var(--muted);font-size:13px}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.prose h3{margin:0 0 6px;font-size:16px}
.prose p,.prose li{margin:0 0 6px;max-width:65ch}
.prose ul{margin:0;padding-left:18px}

/* Bottom nav + timers */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);padding-block:6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--herb)}
.timers{position:fixed;z-index:50;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tpill{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:100%}
.tpill .tl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tpill .tt{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:500}
.tpill button{border:0;background:var(--muted);color:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.tpill.ring{background:var(--tomato);color:#fff}
.tpill.ring button{background:rgba(255,255,255,.25);color:#fff}
@media (prefers-reduced-motion: no-preference){.tpill.ring{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.03)}}
/* Segmented, fridge, ratings */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.on i{background:var(--herb)} .sync.err{color:var(--tomato)} .sync.err i{background:var(--tomato)}
.addrow{display:grid;grid-template-columns:1fr 92px auto;gap:8px;padding:14px}
.addrow input{min-width:0;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--ink)}
.hrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.grp .hrow:last-child{border-bottom:0}
.hrow span{flex:1;min-width:0}
.hrow small{color:var(--muted);margin-left:6px}
.out{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;flex:none}
.out:hover{border-color:var(--tomato);color:var(--tomato)}
.empty{padding:14px;color:var(--muted);font-size:14px;margin:0}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:10px}
.rrow b{width:44px;font-size:14px}
.rrow b.h{color:var(--him)} .rrow b.s{color:var(--her)}
.stars{display:flex;gap:2px}
.star{border:0;background:none;padding:2px;cursor:pointer;color:var(--line);line-height:0}
.star.on{color:#E0A526}
.star svg{width:30px;height:30px}
.rate textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);min-height:60px;resize:vertical;width:100%}
.mstars{color:#E0A526;font-weight:700}
.rank{display:flex;flex-direction:column}
.rank .rr{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.rank .rr:last-child{border-bottom:0}
.rank .rr span{flex:1;min-width:0}
.rank .rr em{font-style:normal;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:380px){.addrow{grid-template-columns:1fr 70px}.addrow .btn{grid-column:1/-1}.facts{grid-template-columns:1fr 1fr}.days{gap:4px}.day span{font-size:15px}}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
.aibtn{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;width:100%;text-align:left;border:1px dashed var(--herb);background:var(--herb-soft);color:var(--herb);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.aibtn svg{grid-row:1/3}
.aibtn span{font-weight:700;font-size:15px}
.aibtn small{color:var(--muted);font-size:13px}
.aip{background:var(--surface);border:1px solid var(--herb);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.aih{display:flex;align-items:center;gap:8px;color:var(--herb)}
.aih b{flex:1;color:var(--ink);font-size:16px}
.aih .x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:disabled{opacity:.5;cursor:default}
.aif{display:flex;flex-direction:column;gap:8px}
.aif textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical;width:100%}
.aif .btn{align-self:flex-end}
.aire{margin:0;font-size:15px}
.aich{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.aich li{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.aich span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.aich s{color:var(--muted)}
.aich em{font-style:normal;font-size:11px;font-weight:700;color:var(--herb);background:var(--herb-soft);border-radius:999px;padding:1px 7px;vertical-align:2px}
.aiact{display:flex;flex-wrap:wrap;gap:8px}
.aierr{margin:0;color:var(--tomato);font-size:14px}
.notice.chg{background:var(--herb-soft);align-items:center}
.notice.chg svg{color:var(--herb)}
.notice.chg span{flex:1}
.lnk{border:0;background:none;color:var(--herb);font-weight:700;font-size:14px;cursor:pointer;padding:0;text-decoration:underline}
.aibuy{background:var(--tomato-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.aibuy b{display:flex;align-items:center;gap:6px;color:var(--tomato)}
.aibuy ul{margin:0;padding-left:20px}
.aibuy small{color:var(--muted);font-size:12px}
.aibuy.ok{background:var(--herb-soft)}
.aibuy.ok b{color:var(--herb)}
.notice.buy{align-items:center}
.notice.buy span{flex:1}
.qb{border:0;background:var(--sunken);border-radius:8px;padding:3px 8px;font:inherit;color:var(--ink);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.scl{display:flex;gap:10px;align-items:center;background:var(--herb-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.scl svg{flex:none;color:var(--herb)}
.scl span{flex:1}
.scl0{margin:0 0 8px}
.scrow td{background:var(--herb-soft)}
.sce{display:flex;flex-direction:column;gap:8px;padding:4px 0;white-space:normal}
.sce label{font-weight:700;font-size:14px}
.scin{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scin input{width:90px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink)}
.sce small{color:var(--muted);font-size:12px}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Кухня на неделю</h1><span class="wk">10–15 ноября</span></div>
    <div class="days" id="days" role="group" aria-label="Дни недели"></div>
  </div>
</header>

<main class="wrap">
  <div class="view" id="v-menu"></div>
  <div class="view" id="v-shop" hidden></div>
  <div class="view" id="v-norms" hidden></div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="r-title">
  <div class="bar"><div class="wrap">

<script>
(function(){
var store={get:function(k,d){try{var v=localStorage.getItem('kw_'+k);return v?JSON.parse(v):d}catch(e){return d}},
           set:function(k,v){try{localStorage.setItem('kw_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Общие данные: что дома, свои продукты, оценки ---------- */
var DATA={have:store.get('have',{}),fridge:store.get('fridge',[]),ratings:store.get('ratings',{})};
var DB=null, SYNC='local', SYNCMSG='';
var queues={};
function serial(path,fn){queues[path]=(queues[path]||Promise.resolve()).then(fn).catch(dbErr)}
function dbErr(e){var c=e&&e.code;
  if(c==='permission-denied'){SYNC='err';SYNCMSG='Нет доступа к общему списку. Откройте сайт по полной ссылке, которую вам прислали.'}
  else if(c==='resource-exhausted'){SYNC='err';SYNCMSG='Бесплатный лимит базы на сегодня закончился. Отметки сохранятся завтра.'}
  else {SYNC='err';SYNCMSG='Не получилось сохранить. Проверьте интернет: как только он появится, отметки отправятся сами.'}
  rerender()}
function saveLocal(){store.set('have',DATA.have);store.set('fridge',DATA.fridge);store.set('ratings',DATA.ratings)}
var API={
  setHave:function(id,on){if(on)DATA.have[id]=1;else delete DATA.have[id];rerender();
    if(DB){var ref=DB.doc('have/'+id);serial('have/'+id,function(){return on?ref.set({at:Date.now()}):ref.delete()})}else saveLocal()},
  addFridge:function(name,qty){var item={name:name,qty:qty,at:Date.now()};
    if(DB){var ref=DB.collection('fridge').doc();item.id=ref.id;DATA.fridge=DATA.fridge.concat([item]);rerender();
      serial('fridge/'+ref.id,function(){return ref.set({name:name,qty:qty,at:item.at})})}
    else{item.id='l'+item.at;DATA.fridge=DATA.fridge.concat([item]);saveLocal();rerender()}},
  delFridge:function(id){DATA.fridge=DATA.fridge.filter(function(x){return x.id!==id});rerender();
    if(DB){var ref=DB.doc('fridge/'+id);serial('fridge/'+id,function(){return ref.delete()})}else saveLocal()},
  rate:function(rid,patch){var body=Object.assign({},DATA.ratings[rid]||{});
    Object.keys(patch).forEach(function(k){if(patch[k]===null||patch[k]==='')delete body[k];else body[k]=patch[k]});
    DATA.ratings[rid]=body;rerender();
    if(DB){var ref=DB.doc('ratings/'+rid);serial('ratings/'+rid,function(){return Object.keys(body).length?ref.set(body):ref.delete()})}else saveLocal()}
};
/* Ключи из ссылки: #k=семья (общий список), &o=ключ владельца (калории и нормы). Запоминаются на телефоне. */
function hashKeys(){var h={};(location.hash||'').replace(/^#/,'').split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)h[p.slice(0,i)]=decodeURIComponent(p.slice(i+1))});return h}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function loadOwner(key){
  if(!(window.crypto&&crypto.subtle&&window.fetch))return;
  var raw;try{raw=b64(key)}catch(e){return}
  fetch('owner.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(f){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(f.iv)},k,b64(f.ct))})
  }).then(function(buf){applyOwner(JSON.parse(new TextDecoder().decode(buf)));rerender();
    if(openId){var y=$('sheet').scrollTop;openRecipe(openId);$('sheet').scrollTop=y}
  }).catch(function(){});
}
function connect(){
  var h=hashKeys();
  if(h.k)store.set('fam',h.k);
  if(h.o){store.set('okey',h.o);try{history.replaceState(null,'',location.pathname+location.search+(h.k?'#k='+h.k:''))}catch(e){}}
  var fam=store.get('fam',null),okey=store.get('okey',null);
  if(okey)loadOwner(okey);
  var cfg=window.FB_CONFIG;
  if(!fam||fam.length<24||!cfg||!window.firebase)return;
  var famRef;
  try{if(!firebase.apps.length)firebase.initializeApp(cfg);famRef=firebase.firestore().collection('families').doc(fam)}catch(e){return}
  DB={collection:function(c){return famRef.collection(c)},doc:function(p){var a=p.split('/');return famRef.collection(a[0]).doc(a[1])}};
  var db=DB;SYNC='shared';SYNCMSG='';rerender();
  var got=0;var t=setTimeout(function(){if(got<6){SYNC='err';SYNCMSG='Общий список пока недоступен. Проверьте интернет.';rerender()}},10000);
  function ok(snap){if(!snap.metadata.fromCache){got++;if(got>=6)clearTimeout(t)}if(SYNC!=='err'||got>=6){SYNC='shared';SYNCMSG=''}}
  function fail(e){clearTimeout(t);dbErr(e)}
  var opt={includeMetadataChanges:true};
  db.collection('have').onSnapshot(opt,function(s){var h={};s.docs.forEach(function(d){h[d.id]=1});DATA.have=h;ok(s);saveLocal();rerender()},fail);
  db.collection('fridge').onSnapshot(opt,function(s){DATA.fridge=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.at||0)-(b.at||0)});ok(s);saveLocal();rerender()},fail);
  db.collection('ratings').onSnapshot(opt,function(s){var r={};s.docs.forEach(function(d){r[d.id]=d.data()});DATA.ratings=r;ok(s);saveLocal();rerender()},fail);
  db.collection('recipes').onSnapshot(opt,function(s){var a={};s.docs.forEach(function(d){try{a[d.id]=JSON.parse(d.data().json)}catch(e){}});AIR=a;loadAi();ensureRefs();ok(s);store.set('air',AIR);rerender()},fail);
  db.collection('extra').onSnapshot(opt,function(s){var a={};s.docs.forEach(function(d){try{a[d.id]=JSON.parse(d.data().json)}catch(e){}});EXTRA=a;ok(s);store.set('extra',EXTRA);rerender()},fail);
  db.collection('plan').onSnapshot(opt,function(s){var a={};s.docs.forEach(function(d){try{a[d.id]=JSON.parse(d.data().meals)}catch(e){}});PLAN=a;ensureRefs();ok(s);store.set('plan',PLAN);rerender()},fail);
}
var rerender=function(){};

/* ---------- Рецепты ---------- */
var R={"pasta":{"short":"паста с фрикадельками","title":"Паста с фрикадельками из индейки","time":"30 мин","serves":"3 порции: ужин на двоих и её обед на завтра","kcal":[null,null],"cols":true,"ing":[["Фарш индейки","500 г","",""],["Яйцо","1 шт.","",""],["Лук","½ шт.","",""],["Чеснок","3 зубчика","",""],["Панировочные сухари","2 ст. л.","",""],["Паста (пенне или спагетти)","220 г","",""],["Томаты в собственном соку или пассата","700 г","",""],["Сухой базилик или орегано","1 ч. л.","",""],["Сахар","щепотка","",""],["Оливковое масло","1 ст. л.","",""],["Пармезан","30 г","",""],["Соль, чёрный перец","по вкусу","",""]],"steps":[["Подготовка","Поставьте на огонь большую кастрюлю с 2,5 л воды. Половину луковицы и 1 зубчик чеснока мелко натрите или порубите. Оставшиеся 2 зубчика нарежьте тонкими пластинками для соуса."],["Фарш","Смешайте фарш, яйцо, лук, чеснок, сухари, ½ ч. л. соли и перец. Вымешивайте рукой 1–2 минуты, пока масса не станет липкой: тогда фрикадельки не развалятся. Мокрыми руками скатайте 18–20 шариков размером с грецкий орех."],["Обжарка","Разогрейте масло в широкой сковороде на огне чуть выше среднего. Выложите фрикадельки в один слой и жарьте, поворачивая, до румяной корочки со всех сторон. Внутри они ещё сырые, это нормально: дойдут в соусе.",300],["Соус","Бросьте к фрикаделькам чеснок пластинками на 30 секунд. Добавьте томаты (целые разомните ложкой), базилик, щепотку сахара и ½ ч. л. соли. Доведите до кипения, убавьте огонь, накройте крышкой и тушите.",720],["Паста","Когда вода закипит, посолите её (1 ст. л. на 2,5 л) и варите пасту на 1 минуту меньше, чем написано на пачке. Перед тем как слить, отлейте полстакана воды из-под пасты.",600],["Соединить","Слейте пасту и вмешайте её в соус. Если соус получился густым, добавьте 2–3 ст. л. отлитой воды. Прогрейте всё вместе 1 минуту."],["Разложить","Отложите порцию в ланчбокс сразу, до ужина. Пармезан посыпьте при подаче."]],"lunchbox":"Её порцию остудите 20–30 минут с открытой крышкой и уберите в холодильник. Пармезан для неё положите в пакетик отдельно.","salad":{"t":"Руккола с черри и пармезаном","k":"","i":["Руккола 100 г","Черри 250 г","Оливковое масло 1 ст. л.","Бальзамик 1 ч. л., щепотка соли"],"s":"Черри разрежьте пополам. Заправку смешайте отдельно и полейте прямо перед едой, иначе руккола обмякнет. Часть рукколы и черри без заправки оставьте ей на завтрашний обед."}},"turkey":{"short":"индейка с булгуром","title":"Индейка в духовке с булгуром и стручковой фасолью","time":"35 мин, из них 10 активно","serves":"3 порции: ужин на двоих и её обед на завтра","kcal":[null,null],"cols":true,"ing":[["Филе грудки индейки","600 г","",""],["Булгур","200 г","",""],["Стручковая фасоль замороженная","500 г","",""],["Чеснок","2 зубчика","",""],["Копчёная паприка","1 ч. л.","",""],["Лимон","½ шт.","",""],["Оливковое масло","1 ст. л. + 1 ч. л.","",""],["Греческий йогурт","150 г","",""],["Укроп","½ пучка","",""],["Соль, чёрный перец","по вкусу","",""]],"steps":[["Духовка","Разогрейте духовку до 200 °C в режиме «верх-низ». Застелите противень бумагой для выпечки."],["Маринад","Нарежьте филе поперёк на стейки толщиной около 2 см. Смешайте 1 ст. л. масла, 1 тёртый зубчик чеснока, паприку, ½ ч. л. соли, перец и сок четвертинки лимона. Натрите стейки. Если есть 10–15 минут, дайте им полежать: мясо будет сочнее."],["Противень","Замороженную фасоль, не размораживая, выложите на одну половину противня, сбрызните 1 ч. л. масла и посолите. Стейки положите на другую половину, не вплотную друг к другу."],["Запекание","Поставьте противень на средний уровень. Готовность проверьте надрезом самого толстого стейка: мясо белое, сок прозрачный, внутри 72 °C. Не передерживайте, иначе грудка пересохнет.",1320],["Булгур","Пока мясо в духовке: прогрейте булгур в сухой кастрюле 1 минуту, помешивая, так появится ореховый вкус. Залейте 400 мл кипятка, добавьте ½ ч. л. соли и варите под крышкой на минимальном огне. Потом снимите с огня и дайте постоять ещё 5 минут.",720],["Соус","Мелко порубите укроп. Смешайте йогурт, укроп, второй тёртый зубчик чеснока, щепотку соли и пару капель лимона."],["Отдых и раскладка","Накройте мясо фольгой на 5 минут и нарежьте ломтиками. Порцию для ланчбокса отложите сразу."]],"lunchbox":"Её индейку сразу нарежьте ломтиками: в микроволновке они прогреются равномернее целого стейка. Соус — в отдельную баночку.","salad":{"t":"Капуста с морковью и яблоком","k":"","i":["Капуста белокочанная 300 г","Морковь 1 шт.","Яблоко 1 шт.","Растительное масло 1 ст. л.","Лимонный сок 1 ст. л., соль ½ ч. л."],"s":"Тонко нашинкуйте капусту, посолите и помните руками минуту, пока не пустит сок. Морковь натрите на крупной тёрке, яблоко нарежьте соломкой. Заправьте маслом и лимоном. Салат хорошо стоит до завтра: возьмите ей порцию в обед."}},"chili":{"short":"чили кон карне","title":"Чили кон карне с рисом","time":"40 мин","serves":"3 порции: ужин на двоих и её обед на завтра","kcal":[null,null],"cols":true,"ing":[["Говяжий фарш 10%","500 г","",""],["Рис","180 г","",""],["Лук","1 шт.","",""],["Болгарский перец","1 шт.","",""],["Чеснок","2 зубчика","",""],["Томатная паста","1 ст. л.","",""],["Томаты в собственном соку","400 г","",""],["Красная фасоль консервированная","1 банка","",""],["Кукуруза консервированная","150 г","",""],["Копчёная паприка","1 ч. л.","",""],["Зира молотая","1 ч. л.","",""],["Острый перец чили","¼–½ ч. л.","",""],["Растительное масло","1 ст. л.","",""],["Соль","по вкусу","",""]],"steps":[["Рис","Промойте рис до прозрачной воды. Залейте 360 мл холодной воды, добавьте ½ ч. л. соли и доведите до кипения. Накройте крышкой и варите на минимальном огне, не открывая.",1080],["Овощи","Лук и перец нарежьте кубиком около 1 см, чеснок — мелко. Разогрейте масло в сотейнике и жарьте лук с перцем до мягкости, в конце добавьте чеснок на 30 секунд.",300],["Фарш","Добавьте фарш и прибавьте огонь. Разбивайте его лопаткой на мелкие крошки и жарьте, пока не уйдёт розовый цвет.",360],["Специи","Всыпьте паприку, зиру, чили и томатную пасту. Перемешайте и жарьте ещё минуту: так специи раскроют аромат."],["Тушение","Фасоль откиньте на дуршлаг и промойте. Добавьте томаты, фасоль, кукурузу и ½ ч. л. соли. Тушите без крышки на слабом огне, помешивая, пока чили не загустеет. Попробуйте на соль и остроту.",1080],["Разложить","Разложите по тарелкам и сразу отложите порцию в ланчбокс."]],"lunchbox":"Чили и рис можно положить в один контейнер. Йогурт и салат — отдельно. На следующий день чили только вкуснее.","salad":{"t":"Перец, огурец и кинза","k":"","i":["Болгарский перец 1 шт.","Огурцы 2 шт.","Кинза несколько веточек","Сок ½ лайма, щепотка соли","Греческий йогурт 1–2 ст. л. на порцию"],"s":"Нарежьте перец и огурцы кубиком, добавьте рубленую кинзу, лайм и соль. На чили положите ложку йогурта вместо сметаны: он смягчает остроту."}},"fajitas":{"short":"фахитас","title":"Фахитас с курицей и перцем","time":"25 мин","serves":"2 порции, ужин на двоих","kcal":[null,null],"cols":true,"ing":[["Куриное филе","400 г","",""],["Болгарский перец разных цветов","2 шт.","",""],["Красный лук","1 шт.","",""],["Лайм","1 шт.","",""],["Копчёная паприка","1 ч. л.","",""],["Зира молотая","½ ч. л.","",""],["Чеснок","1 зубчик","",""],["Соль","½ ч. л.","",""],["Растительное масло","1 ст. л.","",""],["Пшеничные тортильи, около 20 см","5 шт.","",""],["Греческий йогурт","4 ст. л.","",""],["Тёртый сыр","20 г","",""]],"steps":[["Маринад","Нарежьте курицу полосками толщиной около 1 см. Смешайте с соком половины лайма, паприкой, зирой, тёртым чесноком, солью и половиной масла. Пусть постоит, пока режете овощи."],["Овощи","Перец нарежьте полосками шириной 1 см, лук — тонкими полукольцами."],["Курица","Очень сильно разогрейте сковороду. Выложите курицу в один слой и не трогайте 2 минуты, чтобы появилась корочка. Затем перемешайте и жарьте ещё 3–4 минуты до готовности. Переложите в миску.",360],["Перец и лук","В ту же сковороду налейте остаток масла и жарьте перец с луком на сильном огне: они должны остаться чуть хрустящими. Верните курицу и сбрызните соком лайма.",240],["Тортильи","Прогрейте каждую тортилью на сухой сковороде по 15–20 секунд с каждой стороны. Сложите стопкой под полотенце, чтобы не остыли."],["Сборка","Ставьте всё на стол и собирайте сами: йогурт, начинка, ложка салата, по желанию сыр."]],"salad":{"t":"Авокадо, томаты и лайм","k":"","i":["Авокадо 1 шт.","Томаты 2 шт.","Красный лук немного","Кинза, сок ½ лайма, соль"],"s":"Нарежьте авокадо и томаты кубиком, лук — совсем мелко. Смешайте с кинзой, лаймом и солью прямо перед едой: авокадо быстро темнеет. Его можно класть и внутрь тортильи."}},"borscht":{"short":"борщ","title":"Борщ","time":"1 ч 40 мин, из них 40 мин активно","serves":"5–6 порций: обед в субботу и в воскресенье, остаток в морозилку","kcal":[null,null],"cols":false,"ing":[["Говядина на кости","700 г","",""],["Вода","2,5 л","",""],["Свёкла","2 средние, ~400 г","",""],["Капуста белокочанная","400 г","",""],["Картофель","3 шт., ~350 г","",""],["Морковь","1 шт.","",""],["Лук","1 шт.","",""],["Томатная паста","2 ст. л.","",""],["Лимонный сок","1 ст. л.","",""],["Чеснок","2 зубчика","",""],["Лавровый лист","2 шт.","",""],["Перец горошком","5 шт.","",""],["Растительное масло","1 ст. л.","",""],["Соль","~1,5 ч. л.","",""],["Сметана 10–15% к подаче","3 ст. л.","",""],["Ржаной хлеб к подаче","3 ломтика","",""],["Укроп или петрушка","","",""]],"steps":[["Бульон","Промойте мясо, залейте 2,5 л холодной воды и доведите до кипения. Первые 5 минут снимайте пену шумовкой. Добавьте лавровый лист и перец горошком, убавьте огонь до едва заметного кипения, приоткройте крышку. Без кости варите 50 минут.",3600],["Зажарка","Пока варится бульон, натрите свёклу и морковь на крупной тёрке, лук нарежьте кубиком. Обжарьте лук на масле 3 минуты, добавьте морковь и свёклу, ещё через 3 минуты — томатную пасту и лимонный сок. Влейте 2–3 ст. л. бульона и тушите под крышкой на слабом огне. Кислота сохраняет свёкле яркий цвет.",900],["Мясо","Достаньте мясо, отделите от кости и нарежьте небольшими кусочками. Бульон посолите (1     return '<div class="tpill'+(ring?' ring':'')+'"><span class="tl">'+(ring?'Готово: ':'')+esc(t.label)+'</span><span class="tt">'+(ring?'0:00':fmt(left))+'</span><button type="button" data-x="'+t.id+'">'+(ring?'ОК':'Стоп')+'</button></div>'}).join('')}

  if(k==='open'){AIST.open=true;renderMenu();var t=$('ai-q');if(t)t.focus()}
  else if(k==='close'){AIST={open:false,busy:false,q:'',res:null,err:''};renderMenu()}
  else if(k==='apply'){commitPlan(AIST.res.p);AIST={open:false,busy:false,q:'',res:null,err:''};renderMenu()}
  else if(k==='again'){var q=AIST.q;AIST.res=null;aiAsk(q,' (предложи другой вариант, не такой как в прошлый раз)')}
  else if(k==='cancel'){AIST.res=null;renderMenu()}});
$('v-menu').addEventListener('submit',function(e){e.preventDefault();var t=$('ai-q');if(t)aiAsk(t.value)});
$('v-menu').addEventListener('input',function(e){if(e.target.id==='ai-q')AIST.q=e.target.value});
loadAi();ensureRefs();

/* ---------- Пересчёт рецепта под фактическое количество продукта ---------- */
var SCED=null,SC_SIG='';
var FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
var NUMRE=/(\d+(?:[.,]\d+)?)?\s*([½¼¾⅓⅔])|(\d+(?:[.,]\d+)?)/g;
function scaleObj(id){var s=EXTRA['scale-'+id];return s&&s.f>0?s:null}
function scaleOf(id){var s=scaleObj(id);return s?s.f:1}
function scSig(id){return JSON.stringify(scaleObj(id))+'|'+(SCED&&SCED.id===id?SCED.i:'')}
function pnum(m1,fr,m3){if(fr)return (m1?parseFloat(m1.replace(',','.')):0)+FR[fr];return parseFloat(m3.replace(',','.'))}
function fmtNum(v,after){
  if(/^\s*(г|мл)(?![а-яё])/i.test(after)){v=v>=100?Math.round(v/10)*10:v>=20?Math.round(v/5)*5:Math.max(1,Math.round(v));return String(v)}
  if(/^\s*(кг|л)(?![а-яё])/i.test(after))return String(Math.round(v*10)/10).replace('.',',');
  if(v<.375)return '¼';
  var r=Math.round(v*2)/2,w=Math.floor(r);return (w?String(w):'')+(r-w?'½':'')}
function sq(s,f){if(!s||f===1)return s||'';var parts=String(s).split('×'),last=parts.pop();
  last=last.replace(NUMRE,function(all,m1,fr,m3,off,str){var v=pnum(m1,fr,m3);if(!(v>0))return all;
    var lead=all.match(/^\s*/)[0];return (m1||m3?'':lead)+fmtNum(v*f,str.slice(off+all.length))});
  return parts.concat([last]).join('×')}
function baseNum(s){var last=String(s||'').split('×').pop();NUMRE.lastIndex=0;var m=NUMRE.exec(last);NUMRE.lastIndex=0;
  if(!m)return null;var v=pnum(m[1],m[2],m[3]);return v>0?{v:v,unit:last.slice(m.index+m[0].length).trim()}:null}
function numTxt(v){return String(Math.round(v*100)/100).replace('.',',')}
function setScale(id,o){var k='scale-'+id;if(o)EXTRA[k]=o;else delete EXTRA[k];store.set('extra',EXTRA);rerender();
  if(DB){var ref=DB.doc('extra/'+k);serial('extra/'+k,function(){return o?ref.set({json:JSON.stringify(o),at:Date.now()}):ref.delete()})}}
function scaleBanner(id){SC_SIG=scSig(id);var s=scaleObj(id),r=R[id];
  if(!s)return '<p class="legend scl0">Купили другое количество? Нажмите на цифру у продукта, и остальное пересчитается.</p>';
  var a=r.ing[s.i]||['',''];
  return '<div class="scl">'+scaleIco+'<span>Пересчитано под <b>'+esc(a[0])+' — '+esc(s.v)+'</b> (×'+numTxt(s.f)+'). В шагах количества указаны для исходного рецепта.</span><button type="button" class="lnk" data-scr="1">Сбросить</button></div>'}
function scaleEditor(id,i,cols){var a=R[id].ing[i],b=baseNum(a[1]),s=scaleObj(id);
  var cur=s&&s.i===i?s.v.replace(/[^\d.,]/g,''):numTxt(b.v);
  return '<tr class="scrow"><td colspan="'+cols+'"><form class="sce" data-sce="'+i+'"><label for="sce-v">Сколько есть на самом деле?</label>'+
    '<div class="scin"><input id="sce-v" inputmode="decimal" autocomplete="off" value="'+esc(cur)+'"><span>'+esc(b.unit)+'</span>'+
    '<button type="submit" class="btn pri">Пересчитать</button><button type="button" class="btn" data-scx="1">Отмена</button></div>'+
    '<small>По рецепту: '+esc(a[1])+'</small></form></td></tr>'}
var scaleIco='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0zM17 7l-3 7a3 3 0 0 0 6 0z"/></svg>';
function reopen(){if(!openId)return;var y=$('sheet').scrollTop;openRecipe(openId);$('sheet').scrollTop=y}
$('sheet-body').addEventListener('click',function(e){
  var q=e.target.closest('[data-sc]');if(q&&openId){e.stopPropagation();SCED={id:openId,i:+q.dataset.sc};reopen();var inp=$('sce-v');if(inp){inp.focus();inp.select()}return}
  if(e.target.closest('[data-scx]')){SCED=null;reopen();return}
  if(e.target.closest('[data-scr]')&&openId){SCED=null;setScale(openId,null);reopen()}});
$('sheet-body').addEventListener('submit',function(e){var f=e.target.closest('[data-sce]');if(!f||!openId)return;e.preventDefault();
  var i=+f.dataset.sce,a=R[openId].ing[i],b=baseNum(a[1]),v=parseFloat(($('sce-v').value||'').replace(',','.').replace(/[^\d.]/g,''));
  if(!(v>0)){$('sce-v').focus();return}
  var k=v/b.v;if(k<.1||k>10){alert('Слишком большая разница с рецептом. Проверьте число: по рецепту '+a[1]+'.');return}
  SCED=null;if(Math.abs(k-1)<.001)setScale(openId,null);else setScale(openId,{i:i,f:Math.round(k*1000)/1000,v:numTxt(v)+(b.unit?' '+b.unit:'')});reopen()});
function kc(id,v){var k=R[id]&&R[id].src||id,f=scaleOf(k);return f===1?v:Math.round(v*f/10)*10}

/* ---------- Навигация ---------- */
var tab=store.get('tab','menu');
function showTab(t){tab=t;store.set('tab',t);['menu','shop','norms'].forEach(function(x){$('v-'+x).hidden=x!==t});
  document.querySelectorAll('nav.tabs button').forEach(function(b){if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('days').style.display=t==='menu'?'':'none';window.scrollTo(0,0)}
document.querySelector('nav.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});
$('days').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;cur=+b.dataset.i;store.set('day',cur);renderDays();renderMenu();window.scrollTo(0,0)});
$('v-menu').addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(b)openRecipe(b.dataset.r)});
$('back').addEventListener('click',closeRecipe);
$('sheet-body').addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.note){var cur1=(DATA.ratings[t.dataset.note]||{}).note||'';var v=t.value.trim();if(v!==cur1)API.rate(t.dataset.note,{note:v||null})}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openId)closeRecipe()});
$('wake').addEventListener('change',function(){store.set('wake',this.checked);if(this.checked)wakeOn();else wakeOff()});
$('sheet-body').addEventListener('click',function(e){
  var tb=e.target.closest('.timer');if(tb){e.stopPropagation();addTimer(+tb.dataset.t,tb.dataset.l);return}
  var st=e.target.closest('[data-rate]');if(st&&openId){var k=rid(openId);var cur0=(DATA.ratings[k]||{})[st.dataset.rate];var v=+st.dataset.v;var p={};p[st.dataset.rate]=cur0===v?null:v;API.rate(k,p);return}
  var li=e.target.closest('li[data-s]');if(!li||!openId)return;var i=+li.dataset.s;var d=store.get('st_'+openId,[]);var p=d.indexOf(i);
  if(p>-1)d.splice(p,1);else d.push(i);store.set('st_'+openId,d);li.classList.toggle('done');
});

rerender=function(){renderMenu();renderShop();renderNorms();
  if(openId&&SC_SIG!==scSig(openId)){reopen()}else if(openId){var b=$('rate-box');var ae=document.activeElement;if(b&&!(ae&&ae.dataset&&ae.dataset.note))b.innerHTML=rateBlock(openId)}};
renderDays();renderMenu();renderShop();renderNorms();showTab(tab);connect();
})();
</script>
